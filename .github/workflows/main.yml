name: Build libaapt2.so (ARM64, 16KB page, NDK 27)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build protobuf-compiler cmake p7zip-full

      - name: Extract aapt2 sources
        run: |
          mkdir -p aapt2
          7z x build.7z.001 -oaapt2

      - name: Fix 404 Headers and Add Missing Utils
        run: |
          # 1. Arşivden çıkan 404 içerikli bozuk dosyaları temizle
          rm -f aapt2/android-base/expected.h
          rm -f aapt2/android-base/unique_fd.h

          mkdir -p aapt2/android-base
          mkdir -p aapt2/utils

          # 2. AOSP master dalından güncel ve temiz başlıkları çek
          curl -fSL https://raw.githubusercontent.com/aosp-mirror/platform_system_libbase/master/include/android-base/expected.h -o aapt2/android-base/expected.h
          curl -fSL https://raw.githubusercontent.com/aosp-mirror/platform_system_libbase/master/include/android-base/unique_fd.h -o aapt2/android-base/unique_fd.h

          # 3. Eksik utils başlıklarını çek
          curl -fSL https://raw.githubusercontent.com/aosp-mirror/platform_system_core/master/libutils/include/utils/Unicode.h -o aapt2/utils/Unicode.h
          curl -fSL https://raw.githubusercontent.com/aosp-mirror/platform_system_core/master/libutils/include/utils/Errors.h -o aapt2/utils/Errors.h
          curl -fSL https://raw.githubusercontent.com/aosp-mirror/platform_system_core/master/libutils/include/utils/String8.h -o aapt2/utils/String8.h
          curl -fSL https://raw.githubusercontent.com/aosp-mirror/platform_system_core/master/libutils/include/utils/String16.h -o aapt2/utils/String16.h

      - name: Configure CMake with NDK 27
        run: |
          NDK_PATH="/usr/local/lib/android/sdk/ndk/27.3.13750724"

          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_NDK="$NDK_PATH" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-error" \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -G Ninja

      - name: Build libaapt2
        run: cmake --build build --config Release -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaapt2
          path: build/libaapt2.so
