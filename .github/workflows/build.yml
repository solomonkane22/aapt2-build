name: Build libaapt2_device (Soong minimal)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install base deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3 openjdk-11-jdk unzip zip bc gcc g++ make ninja-build libxml2-utils golang-go

      - name: Install repo tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo mv repo /usr/local/bin/

      - name: Init minimal AOSP workspace (use valid branch)
        run: |
          mkdir -p aosp && cd aosp
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # ใช้ branch ที่มีจริง — ถ้าไม่แน่ใจ ให้ใช้ -b master หรือลบ -b
          repo init -u https://android.googlesource.com/platform/manifest -b master

          # สร้าง local manifest (แก้เพิ่ม project ตาม error ที่เจอ)
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/minimal.xml <<'EOF'
          <manifest>
            <remote name="aosp" fetch="https://android.googlesource.com/" />
            <default remote="aosp" revision="master" />

            <!-- Build system + toolchain -->
            <project name="platform/build/soong" path="build/soong" />
            <project name="platform/build/make" path="build/make" />
            <project name="platform/prebuilts/clang/host/linux-x86" path="prebuilts/clang/host/linux-x86" />
            <project name="platform/prebuilts/go" path="prebuilts/go" />
            <project name="platform/prebuilts/build-tools" path="prebuilts/build-tools" />

            <!-- aapt2 source -->
            <project name="platform/frameworks/base" path="frameworks/base" />

            <!-- libs ที่ aapt2 อาจอิง -->
            <project name="platform/system/core" path="system/core" />
            <project name="platform/system/logging" path="system/logging" />
            <project name="platform/system/libbase" path="system/libbase" />
            <project name="platform/system/libziparchive" path="system/libziparchive" />
            <project name="platform/external/expat" path="external/expat" />
            <project name="platform/external/libpng" path="external/libpng" />
            <project name="platform/external/zlib" path="external/zlib" />
            <project name="platform/external/protobuf" path="external/protobuf" />
          </manifest>
          EOF

          # sync เฉพาะที่ระบุ (depth=1 เพื่อลดขนาด)
          repo sync -c -j4 --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync --depth=1

      - name: Patch Android.bp (add libaapt2_device with 16KB ldflags)
        working-directory: aosp/frameworks/base/tools/aapt2
        run: |
          if ! grep -q "libaapt2_device" Android.bp; then
            cat >> Android.bp <<'EOF'
            cc_library_shared {
              name: "libaapt2_device",
              // (… รายการ srcs ยาว ๆ เหมือนที่โคโด่ะให้ไว้ก่อนหน้านี้ …)
              stl: "c++_shared",
              ldflags: [
                "-Wl,-z,max-page-size=16384",
                "-Wl,-z,common-page-size=16384",
              ],
            }
            EOF
          fi

      - name: Build with Soong
        working-directory: aosp
        run: |
          source build/envsetup.sh
          lunch aosp_arm64-eng
          m libaapt2_device

      - name: Verify and upload
        working-directory: aosp
        run: |
          SO_PATH=$(find out -type f -name "libaapt2_device.so" | head -n1 || true)
          echo "FOUND: $SO_PATH"
          if [ -z "$SO_PATH" ]; then
            echo "No .so produced — check logs for missing deps"
            exit 1
          fi
          readelf -lW "$SO_PATH" | egrep "LOAD|Align"
        # upload
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaapt2-device-16kb
          path: aosp/out/**/libaapt2_device.so
