name: Build libaapt2.so

on:
  workflow_dispatch: # ให้กด run เองได้จากหน้า GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake unzip

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 34
          ndk-version: 28.0.12433566 # รองรับ 16KB page size

      - name: Build libaapt2.so
        run: |
          echo "⚡ ที่นี่คือที่คุณต้องใส่คำสั่ง build จริงของ aapt2"
          echo "เช่น cmake หรือ ./gradlew ตามโปรเจกต์ของคุณ"
          # ตอนนี้ผมใส่ placeholder ไว้ก่อน
          mkdir -p build/lib/arm64-v8a
          echo "fake-binary" > build/lib/arm64-v8a/libaapt2.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaapt2
          path: build/lib/arm64-v8a/libaapt2.so
