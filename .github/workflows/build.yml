name: Build libaapt2.so

on:
  workflow_dispatch: # ให้กด run เองได้จากหน้า GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ ดึง source จาก repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ ติดตั้ง dependencies บน Ubuntu
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build cmake unzip openjdk-17-jdk pkg-config zlib1g-dev libpng-dev libexpat1-dev

      # 3️⃣ ติดตั้ง Android SDK + NDK
      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          sdk-version: 34
          ndk-version: 28.0.12433566 # รองรับ 16KB page size

      # 4️⃣ Build libaapt2.so
      - name: Build libaapt2.so
        run: |
          mkdir -p build
          cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21
          cmake --build . --target aapt2

      # 5️⃣ อัปโหลด artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaapt2
          path: build/**/*.so
