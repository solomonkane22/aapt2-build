name: Build libaapt2.so (16KB page)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install base deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 openjdk-11-jdk \
            unzip zip bc gcc g++ make ninja-build \
            libxml2-utils

      - name: Install repo tool
        run: |
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo mv repo /usr/local/bin/

      - name: Init minimal AOSP workspace
        run: |
          mkdir -p aosp && cd aosp
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # ใช้ manifest ทางการ (ระบุ branch/tag ชัดเจน)
          repo init -u https://android.googlesource.com/platform/manifest -b refs/tags/android-14.0.0_r84 --depth=1
          # local_manifests: ดึงเฉพาะโปรเจ็กต์ที่ aapt2 ต้องใช้
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/minimal.xml <<'EOF'
          <manifest>
            <remote name="aosp" fetch="https://android.googlesource.com/" />
            <default remote="aosp" revision="android-14.0.0_r84" />

            <!-- Build system + toolchain -->
            <project name="platform/build/soong" path="build/soong" />
            <project name="platform/build/make" path="build/make" />
            <project name="platform/prebuilts/clang/host/linux-x86" path="prebuilts/clang/host/linux-x86" clone-depth="1" />

            <!-- aapt2 source -->
            <project name="platform/frameworks/base" path="frameworks/base" />

            <!-- libs ที่ aapt2 อิง -->
            <project name="platform/system/core" path="system/core" />
            <project name="platform/system/logging" path="system/logging" />
            <project name="platform/system/libbase" path="system/libbase" />
            <project name="platform/system/libziparchive" path="system/libziparchive" />
            <project name="platform/external/expat" path="external/expat" />
            <project name="platform/external/libpng" path="external/libpng" />
            <project name="platform/external/zlib" path="external/zlib" />
            <project name="platform/external/protobuf" path="external/protobuf" />
          </manifest>
          EOF

          # ดึงซอร์ส (ลบ --depth ออกไปแล้ว)
          repo sync -c -j4 --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync

      - name: Patch Android.bp for device .so + 16KB
        working-directory: aosp/frameworks/base/tools/aapt2
        run: |
          if ! grep -q "libaapt2_device" Android.bp; then
            cat >> Android.bp <<'EOF'

            // ===== Added by CI: build shared lib for device with 16KB page size =====
            cc_library_shared {
                name: "libaapt2_device",
                srcs: [
                    "compile/IdAssigner.cpp",
                    "compile/InlineXmlFormatParser.cpp",
                    "compile/PseudolocaleGenerator.cpp",
                    "compile/Pseudolocalizer.cpp",
                    "compile/XmlIdCollector.cpp",
                    "configuration/ConfigurationParser.cpp",
                    "dump/DumpManifest.cpp",
                    "filter/AbiFilter.cpp",
                    "filter/ConfigFilter.cpp",
                    "format/Archive.cpp",
                    "format/Container.cpp",
                    "format/binary/BinaryResourceParser.cpp",
                    "format/binary/ResChunkPullParser.cpp",
                    "format/binary/ResEntryWriter.cpp",
                    "format/binary/TableFlattener.cpp",
                    "format/binary/XmlFlattener.cpp",
                    "format/proto/ProtoDeserialize.cpp",
                    "format/proto/ProtoSerialize.cpp",
                    "io/File.cpp",
                    "io/FileSystem.cpp",
                    "io/StringStream.cpp",
                    "io/Util.cpp",
                    "io/ZipArchive.cpp",
                    "link/AutoVersioner.cpp",
                    "link/FeatureFlagsFilter.cpp",
                    "link/FlagDisabledResourceRemover.cpp",
                    "link/ManifestFixer.cpp",
                    "link/NoDefaultResourceRemover.cpp",
                    "link/PrivateAttributeMover.cpp",
                    "link/ReferenceLinker.cpp",
                    "link/ResourceExcluder.cpp",
                    "link/TableMerger.cpp",
                    "link/XmlCompatVersioner.cpp",
                    "link/XmlNamespaceRemover.cpp",
                    "link/XmlReferenceLinker.cpp",
                    "optimize/MultiApkGenerator.cpp",
                    "optimize/ResourceDeduper.cpp",
                    "optimize/ResourceFilter.cpp",
                    "optimize/Obfuscator.cpp",
                    "optimize/VersionCollapser.cpp",
                    "process/ProductFilter.cpp",
                    "process/SymbolTable.cpp",
                    "split/TableSplitter.cpp",
                    "text/Printer.cpp",
                    "text/Unicode.cpp",
                    "text/Utf8Iterator.cpp",
                    "util/Files.cpp",
                    "util/Util.cpp",
                    "Debug.cpp",
                    "DominatorTree.cpp",
                    "java/AnnotationProcessor.cpp",
                    "java/ClassDefinition.cpp",
                    "java/JavaClassGenerator.cpp",
                    "java/ManifestClassGenerator.cpp",
                    "java/ProguardRules.cpp",
                    "LoadedApk.cpp",
                    "Resource.cpp",
                    "ResourceParser.cpp",
                    "ResourceTable.cpp",
                    "ResourceUtils.cpp",
                    "ResourceValues.cpp",
                    "SdkConstants.cpp",
                    "trace/TraceBuffer.cpp",
                    "xml/XmlActionExecutor.cpp",
                    "xml/XmlDom.cpp",
                    "xml/XmlPullParser.cpp",
                    "xml/XmlUtil.cpp",
                    "ApkInfo.proto",
                    "Configuration.proto",
                    "Resources.proto",
                    "ResourceMetadata.proto",
                    "ResourcesInternal.proto",
                    "ValueTransformer.cpp",
                ],
                proto: {
                    export_proto_headers: true,
                    type: "full",
                },
                shared_libs: [
                    "libandroidfw",
                    "libutils",
                    "liblog",
                    "libcutils",
                    "libexpat",
                    "libziparchive",
                    "libpng",
                    "libbase",
                    "libprotobuf-cpp-full",
                    "libz",
                    "libbuildversion",
                    "libidmap2_policies",
                ],
                cpp_std: "gnu++2b",
                cflags: ["-Wall", "-Werror", "-Wno-unused-parameter"],
                cppflags: ["-Wno-missing-field-initializers", "-fno-exceptions", "-fno-rtti", "-Wno-deprecated-declarations"],
                stl: "c++_shared",
                ldflags: [
                    "-Wl,-z,max-page-size=16384",
                    "-Wl,-z,common-page-size=16384",
                ],
            }
            EOF
          fi

      - name: Build with Soong
        working-directory: aosp
        run: |
          source build/envsetup.sh
          lunch aosp_arm64-eng
          m libaapt2_device

      - name: Show and verify Align
        working-directory: aosp
        run: |
          SO_PATH=$(find out -type f -name "libaapt2_device.so" | head -n1)
          echo "FOUND: $SO_PATH"
          readelf -lW "$SO_PATH" | egrep "LOAD|Align" || true

          BAD=$(readelf -lW "$SO_PATH" | awk '/LOAD/ {print $(NF)}' | grep -v 0x4000 || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: Some segments are not aligned to 0x4000"
            exit 2
          fi

      - name: Upload artifact (.so)
        uses: actions/upload-artifact@v4
        with:
          name: libaapt2-device-16kb
          path: |
            aosp/out/**/libaapt2_device.so
