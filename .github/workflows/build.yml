name: Build libaapt2.so

on:
  workflow_dispatch:  # ให้กด Run เองได้จาก GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: /usr/local/android-ndk  # สำหรับ cross compile ถ้าจำเป็น
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build openjdk-11-jdk python3 unzip

    - name: Download AOSP aapt2 source
      run: |
        mkdir aosp && cd aosp
        git clone https://android.googlesource.com/platform/frameworks/base.git
        cd base/tools/aapt2
        git checkout master  # หรือ tag ที่ต้องการ

    - name: Patch Android.bp for 16KB
      run: |
        cd aosp/base/tools/aapt2
        # เพิ่ม ldflags ให้ Align 16KB
        sed -i '/cc_library_host_static {/a \
        \    ldflags: ["-Wl,-z,max-page-size=16384","-Wl,-z,common-page-size=16384"],' Android.bp

    - name: Build libaapt2.so
      run: |
        cd aosp
        source build/envsetup.sh
        lunch aosp_arm64-eng
        m libaapt2

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libaapt2-so
        path: aosp/out/host/linux-x86/bin/libaapt2.so
